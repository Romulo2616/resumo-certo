<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Estudo Certo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilo.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-lg border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <button onclick="goBack()" class="mr-4 text-gray-600 hover:text-gray-900">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </button>
                    <i class="fas fa-graduation-cap text-2xl text-indigo-600 mr-2"></i>
                    <h1 class="text-xl font-bold text-gray-900">Estudo Certo</h1>
                </div>
                <div class="text-sm text-gray-600 flex items-center">
                    <span id="current-subject" class="font-medium">Matemática</span>
                    <span class="mx-2">•</span>
                    <span id="current-topic" class="font-medium">Bhaskara</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 h-screen flex flex-col">
        
        <!-- Welcome Message -->
        <div id="welcome-message" class="bg-white rounded-lg shadow-sm border p-6 mb-6">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-robot text-indigo-600"></i>
                    </div>
                </div>
                <div class="ml-3">
                    <p class="text-gray-900 font-medium">Assistente de Estudos</p>
                    <p class="text-gray-600 mt-1">
                        Olá! Sou seu assistente de estudos. Vamos estudar <span class="font-semibold" id="topic-name">este assunto</span> juntos! 
                        Faça perguntas, tire dúvidas e ao final eu vou recomendar algumas questões para você praticar.
                    </p>
                </div>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 mb-6">
            <!-- Mensagens do chat aparecerão aqui -->
        </div>

        <!-- Chat Input -->
        <div class="bg-white rounded-lg shadow-sm border p-4">
            <div class="flex items-end space-x-3">
                <div class="flex-1">
                    <textarea 
                        id="message-input" 
                        placeholder="Digite sua pergunta ou dúvida..."
                        class="w-full p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        rows="2"
                    ></textarea>
                </div>
                <button 
                    id="send-button"
                    class="bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            
            <!-- Quick Actions -->
            <div class="mt-3 flex flex-wrap gap-2">
                <button class="quick-action bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm hover:bg-gray-200 transition-colors">
                    Explique o conceito básico
                </button>
                <button class="quick-action bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm hover:bg-gray-200 transition-colors">
                    Dê um exemplo prático
                </button>
                <button class="quick-action bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm hover:bg-gray-200 transition-colors">
                    Como resolve exercícios?
                </button>
                <button class="quick-action bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm hover:bg-indigo-200 transition-colors">
                    Quero questões para praticar
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading-indicator" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-indigo-600"></div>
            <span class="text-gray-700">Pensando...</span>
        </div>
    </div>

    <script src="js/scripts.js"></script>
</body>
</html>
