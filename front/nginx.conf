server {
    listen 80;
    server_name _;

    # Arquivos estáticos do front (ajuste o path se for outro)
    root /usr/share/nginx/html;
    index index.html;

    # Proxy para o backend dentro da rede do Docker
    location /message {
        proxy_pass http://back:8000/chat;
        proxy_http_version 1.1;

        # Cabeçalhos úteis
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Se o endpoint usar WebSocket, deixe estes:
        proxy_set_header Upgrade $http_upgrade;
        proxy_read_timeout 86400;
    }

    # (Opcional) SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
