<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assuntos - Estudo Certo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilo.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-6">
                <div class="flex items-center">
                    <button onclick="goBack()" class="mr-4 text-gray-600 hover:text-gray-900">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </button>
                    <i class="fas fa-graduation-cap text-3xl text-indigo-600 mr-3"></i>
                    <h1 class="text-2xl font-bold text-gray-900">Estudo Certo</h1>
                </div>
                <div class="text-sm text-gray-600">
                    <i class="fas fa-target mr-2"></i>
                    <span id="subject-name">Matéria</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Subject Header -->
        <div class="text-center mb-12">
            <div id="subject-icon" class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-calculator text-3xl text-blue-600"></i>
            </div>
            <h2 class="text-4xl font-bold text-gray-900 mb-4" id="subject-title">
                Matemática
            </h2>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto">
                Escolha o assunto que você deseja estudar
            </p>
        </div>

        <!-- Tabs -->
        <div class="mb-8">
            <div class="flex flex-wrap justify-center gap-2">
                <button id="tab-main" class="tab-button active bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium transition-all hover:bg-indigo-700">
                    Assuntos Principais
                </button>
                <button id="tab-diverse" class="tab-button bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium transition-all hover:bg-gray-300">
                    Assuntos Diversos
                </button>
            </div>
        </div>

        <!-- Topics Grid -->
        <div id="topics-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Os assuntos serão carregados dinamicamente pelo JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="text-center text-gray-600">
                <p>&copy; 2024 Estudo Certo. Preparação inteligente para o ENEM.</p>
            </div>
        </div>
    </footer>

    <script src="js/dados.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
